# Pipeline settings. Paths are relative to the repo root unless absolute.

sfoe:
  csv_url: https://www.uvek-gis.admin.ch/BFE/ogd/17/ogd17_fuellungsgrad_speicherseen.csv
  pdf_collection_url: https://pubdb.bfe.admin.ch/en/sammlungen/energiestatistik-fuellungsgrad-der-speicherseen
  pdf_download_base: https://pubdb.bfe.admin.ch/de/publication/download/
  regions: [Wallis, Graubuenden, Tessin, UebrigCH, TotalCH]
  # Historical known_time: Thursday after the Sunday, 23:59 Europe/Zurich.
  known_time_weekday: 3   # Monday=0, so Thursday=3
  known_time_clock: "23:59"
  timezone: Europe/Zurich

norms:
  window_years: 10
  long_window_years: 20
  # A norm is only defined when the full window of past years is present.

entsoe:
  # Step 0: CH has isolated days 2014-01-08, 2014-12-02 and 2014-12-23, and is continuous
  # from 2015-01-01. DE_LU, FR and IT_NORD start on 2015-01-05.
  start: "2014-12-01"
  zones: [CH, DE_LU, FR, IT_NORD]
  # Before the DE-AT split the German price area was DE_AT_LU.
  de_split_date: "2018-10-01"
  timezone: Europe/Zurich
  # Conservative time a day-ahead price for delivery day D is known: D-1 at this clock.
  price_known_clock: "13:00"

smard:
  start: "2018-10-01"
  # SMARD chart_data filter ids (region DE-LU), checked against ENTSO-E in Step 2.
  filters: { DE_LU: 4169, CH: 259, FR: 254 }

hypothesis:
  season_months: [11, 12, 1, 2, 3, 4]
  horizon_days: 28
  # Smallest effect of interest: EUR 2/MWh per 10 points of deviation.
  sesoi_eur_per_10pp: 2.0
  satellite_head_start_days: 4

hero:
  band_first_hydro_year: 2000   # hydrological year 2000/01 (from ISO week 40 of 2000)
  band_last_hydro_year: 2024    # hydrological year 2024/25

satellite:
  s2_start: "2017-03-28"
  landsat_start: "2013-04-11"
  # Months used per reservoir: all months for these, June to November for the rest.
  all_months: [sihlsee, gruyere]
  season_months: [6, 7, 8, 9, 10, 11]
  cs_cdf_min: 0.6
  min_clear_fraction: 0.90
  nir_max: 0.12
  shadow_heavy_share: 0.20
  # snow_ice: bright pixels with high MNDWI (MNDWI is the NDSI) cover this share of the
  # full-supply lake.
  snow_ice_share: 0.05
  # Level checks (Step 5)
  no_match_m: 3.0
  # Weekly alignment (Step 6)
  max_days_from_week_end: 3
  # Lake ice (decision of 2026-10-21): a below_floor scene is ice_likely if its water area is
  # under ice_area_share of the area at the swissALTI3D floor and ERA5-Land had at least
  # ice_frost_days days with daily mean 2 m temperature below 0 C in the ice_window_days before.
  ice_area_share: 0.5
  ice_frost_days: 10
  ice_window_days: 30

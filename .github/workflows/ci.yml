name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install from the lock file
        run: uv sync --locked
      - name: Lint
        run: make lint
      - name: Tests
        run: make test
      - name: Demo builds from committed data, with no keys
        run: make demo
      - name: No raw or price data tracked
        run: make check
